[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[project]
name = "orbit-gen"
version = "0.2.0"
description = "Periodic orbit family generation in the Circular Restricted Three-Body Problem (CR3BP)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jayden Ripic", email = "jmr595@cornell.edu" },
]
keywords = ["Astrodynamics", "CR3BP", "Orbital Mechanics", "Periodic Orbits", "Three-Body Problem"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "astropy>=7.2.0",
    "numpy>=1.24",
    "platformdirs>=4.10.0",
    "pyyaml>=6.0.3",
    "scipy>=1.9.2",
    "spiceypy>=8.1.0",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"

[project.urls]
Repository = "https://github.com/jmripic/orbit-gen"

[project.optional-dependencies]
plotting = [
    "matplotlib>=3.10",
]
